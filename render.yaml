services:
  - type: web
    name: sharemarketexpert-admin
    runtime: docker
    plan: free
    region: singapore # Closest region to India for low latency
    dockerfilePath: ./Dockerfile
    healthCheckPath: /login.html
    autoDeploy: true
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: ADMIN_DEFAULT_USER
        value: "Nagma"
      - key: ADMIN_DEFAULT_PASS
        sync: false
      - key: APP_ENV
        value: "production"
